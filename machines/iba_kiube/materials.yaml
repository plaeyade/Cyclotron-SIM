# ---------------------------------------------------------------------------
# Propiedades para FEM (COMSOL / Abaqus / ANSYS). Valores nominales de handbook,
# 20 °C — EST hasta tener certificados del fabricante.
#   E [GPa], nu [-], k [W/m·K], cp [J/kg·K], alpha [1e-6/K], sigma_el [MS/m]
fem_properties:
  steel_1010:        {E: 205, nu: 0.29, k: 49.8, cp: 448, alpha: 12.2, sigma_el: 6.99, magnetic: bh_acero_bajoC_kiube}
  copper_coil_homog: {E: 60,  nu: 0.34, k: 120,  cp: 385, alpha: 17.0, sigma_el: 40.0, note: "homogeneizado Cu+epoxi: E y k efectivos EST (anisotrópico en realidad)"}
  copper_ofe:        {E: 117, nu: 0.34, k: 391,  cp: 385, alpha: 17.0, sigma_el: 58.0}
  stainless_304L:    {E: 193, nu: 0.29, k: 16.2, cp: 500, alpha: 17.3, sigma_el: 1.39, mu_r: 1.005}
  aluminum_6061:     {E: 68.9, nu: 0.33, k: 167, cp: 896, alpha: 23.6, sigma_el: 25.0}
  niobium:           {E: 105, nu: 0.40, k: 53.7, cp: 265, alpha: 7.3,  sigma_el: 6.58}
  titanium:          {E: 116, nu: 0.32, k: 21.9, cp: 523, alpha: 8.6,  sigma_el: 2.38}
  havar:             {E: 207, nu: 0.30, k: 14.7, cp: 460, alpha: 12.6, sigma_el: 1.0}
  graphite_foil:     {E: 10,  nu: 0.20, k: 100,  cp: 710, alpha: 4.0}

# Curva B-H representativa de acero bajo carbono tipo 1010 (forma típica de librería FEM).
# H [A/m] → B [T].  EST: reemplazar por la curva medida del lote (IBA usa acero de bajo C
# controlado). Más allá de 2.0 T usar extrapolación con μ0 (dB/dH = μ0).
bh_steel_1010:
  H: [0, 238.7, 318.3, 358.1, 437.7, 477.5, 636.6, 795.8, 1114.1, 1591.5, 2228.2, 3183.1, 4774.6, 6366.2, 7957.7, 15915.5, 31831.0, 55704.2, 95493.0, 127324.0, 159155.0]
  B: [0, 0.25, 0.50, 0.75, 1.00, 1.10, 1.20, 1.30, 1.40, 1.50, 1.55, 1.60, 1.65, 1.70, 1.75, 1.80, 1.90, 2.00, 2.10, 2.16, 2.20]

# v0.18: acero de bajo carbono del imán, calibrado con el FE 3D frente a KEY22 (validation/calibrar_iman.py).
# Misma forma que la 1010 representativa, con la polarización reescalada: B = μ0·H + J_1010(H)·(2.12/2.00).
# La 1010 genérica satura en J_s ≈ 2.0 T; el acero de bajo C de ciclotrones llega a 2.10–2.15 T (hierro puro 2.16 T).
# Con la 1010 el FE pedía 170 kA·v; con esta, 116 kA·v (potencia: 105, rango 100–115).
# CALC (J_s = 2.12 T). Reemplazar por la curva medida del lote si se consigue. Más allá del último punto: dB/dH = μ0.
bh_acero_bajoC_kiube:
  Js_T: 2.12
  H: [0.0, 238.7, 318.3, 358.1, 437.7, 477.5, 636.6, 795.8, 1114.1, 1591.5, 2228.2, 3183.1, 4774.6, 6366.2, 7957.7, 15915.5, 31831.0, 55704.2, 95493.0, 127324.0, 159155.0]
  B: [0.0, 0.265, 0.53, 0.795, 1.06, 1.166, 1.272, 1.3779, 1.4839, 1.5899, 1.6428, 1.6958, 1.7486, 1.8015, 1.8544, 1.9068, 2.0116, 2.1158, 2.2188, 2.28, 2.32]
