# Cyclone KIUBE 18 MeV — parámetros del modelo paramétrico  (v0.6)
# Unidades: mm, grados, T, MeV.  Origen: centro de máquina, plano medio z = 0.
# Fuentes:
#   TUP03  Kleeven et al., Cyclotrons2016 — extracción
#   TUP04  Zaremba et al., Cyclotrons2016 — imán (texto)
#   T04F1  TUP04 Fig.1 (circuito magnético A–F, proporciones)
#   T04F2  TUP04 Fig.2 (planta a escala: 937 px = 1740 mm, ±3 mm)   ← MEDIDO
#   T04F3  TUP04 Fig.3 (polo, ranura e inserto)
#   T04F8  TUP04 Fig.8 (RF = 40.646 MHz)
#   TUD03  Nactergal et al., Cyclotrons2016 — desarrollo
#   S09    Van de Walle et al., ICAP2018 SUPAG09 Fig.1 (mapa de campo medido + foto)
#   BON21  Bonvin et al., ARI 168 (2021) — bobinas/blancos Cyclone 18/9
#   PAT    Patente IBA borde de colina (arco descentrado, Rh ≤ 0.85·Lh) = US9961757 (EP3244708, prior. EP16169490)
#   PAT16  Familia de 4 patentes IBA (prior. 13-05-2016): US9907153 ciclotrón compacto (Gv 200–250 mm reiv. 19, 2Ra/La ≥ 70 %),
#          US10064264 inserto de polo, US10278277 corrector de gradiente. Solo rangos; sin potencia ni NI (validation/patentes_iba.py)
#   CALC   Derivado por cálculo de datos publicados
#   DS     Ficha técnica IBA Cyclone KIUBE V6 (ago-2026) y versión anterior (doc. del usuario)
#   DSR    Medido/estimado sobre las renders oficiales de la ficha (proporciones, ±10 %)
#   VE24   do Carmo et al., Instruments 8 (2024) 38 — energía variable; Fig.1 planta, Fig.3 trayectorias 13/18 MeV (digitalizadas)
#   KEY22  Nuttens et al., Cyclotrons2022 WEAO03 — Cyclone KEY; Fig.3 <B> y flutter del KIUBE (digitalizados)
#   IPAC26 Herrod et al., IPAC2026 MOP7178 — masas del imán (14 t acero, 2 t Cu) y potencia 19 kW
#   CERN-CH Chiggiato, "Outgassing properties of vacuum materials for particle accelerators", CAS 2017, arXiv:2006.07124
#   IKON   van der Kraaij et al., Cyclotrons2022 MOBO01 (Cyclone IKON, "hermano mayor" del KIUBE)
#   CERN-CH Chiggiato, Outgassing properties of vacuum materials for particle accelerators, CAS 2017, arXiv:2006.07124
#   CERN-IS Chiggiato, Vacuum technology for ion sources, CAS 2012 (CERN-2013-007), arXiv:1404.0960
#   F7     Medido en la foto VE24 p.7 (escala: altura del yugo), ±20 %
#   RPOS   Radiopharma-OS (plano del búnker del proyecto)
#   SRG    IBA «Cyclone KIUBE Site Requirement Guide» MID 55672 Rev. G (2023) + planos SRG-0xxx anexos.
#          Documento del usuario, con derechos de uso. Modelo de uso personal: sin restricción de datos.
#   CBR    Folleto IBA «Cyclone KIUBE – Max potential, max capacity» (jul-2017), público
#   PROP   Cotización presupuestaria IBA Ref. 2025/8499 v02.01 (Hospitales Zumaya, Villahermosa).
#          Documento del usuario, con derechos de uso. Se usa la configuración técnica (precios no relevantes para el modelo).
#   JUAS22 van der Kraaij (IBA), «Accelerators for Medicine and Industry», JUAS 2022 (público): tabla Cyclone 18P = KIUBE
#          (p.68/157) y fotos del diseño de valle profundo C18/9 (p.44–45: dees + dummy dees a tierra, gap chimenea–puller ≈ 1.5 mm)
#   CY11   Nuttens et al. (IBA), «Design of IBA Cyclone 11 cyclotron magnet», Cyclotrons 2010 MOPCP072 (TOSCA; +160 G/10 A a 186 A;
#          relleno de valle 50/100 mm → +180/+450 G, flutter < 5 %; carrusel diseño C18/9: horquilla 25 mm, 2 láminas, 8 azimuts)
#   TUD03T Nactergal (IBA), presentación oral TUD03 de Cyclotrons 2016 (16 diap.): imán < 11 kW, mapa Opera de la región central,
#          4 × VHS-6 y bombeo medido, vacío base 2.7e-7 mbar, transmisiones; patentes EP16169489/-90/-94/-97
#   KIR30  Jung et al. (KIRAMS), EPAC2006 TUPCH137: RF del KIRAMS-30 (modelo de línea de transmisión + CST; validación del método)
#   VUB24  Covens (VUB-UZ Brussel), «Target shielding in a PET-production facility», FANC 16-10-2024: KIUBE desde 2017, blancos cónicos
#          Nirta 2XL/3XL, puertas HDPE 18 cm, activación del hormigón medida (Eu-152, Co-60) y calculada por IBA
#   CON13  Devillet et al. (IBA), Cyclotrons2013 WEPSH043: blancos cónicos de Nb (2.4/3.4/5/7 ml), ventana Havar 35 µm
#   RGSR   Reglamento General de Seguridad Radiológica (México, 1988): público 5 mSv/año (Art. 37), 1 mSv/año prolongado (Art. 38)
#   NCRP151 NCRP Report 151, factores de ocupación (T = 1/40 ocupación mínima)
#   AUT15  wep09 ICAP2015, imán de ciclotrón 18 MeV con TOSCA (referencia de acero AISI 1010)
#   BATAN13 Atom Indonesia 2014, imán del ciclotrón 13 MeV de BATAN con Opera-3D/TOSCA (eficiencia B_valle/(μ0·NI/g) = 0.84)
#   CONST  Constante física o condición de referencia (no es una estimación)
#   MODELO Opción de configuración del modelo (no es una cota de la máquina)
#   EST    Estimado — REEMPLAZAR cuando haya documento

beam:
  T_MeV:            {v: 18.0,   src: TUP03}
  ion:              {v: H-,     src: TUP03}
  rf_MHz:           {v: 40.646, src: T04F8}
  rf_harmonic:      {v: 2,      src: CALC, note: "B0 = 1.335 T; <B>(18 MeV) = 1.360 T"}
  dee_voltage_kV:   {v: 40.0,   src: TUD03}
  B_hill_T:         {v: 2.15,   src: S09,  note: "mapa medido: 2.2–2.3 T en colina, ~1.8–1.9 sobre el inserto; media efectiva"}
  B_valley_T:       {v: 0.45,   src: S09,  note: "mapa medido 0.40–0.50 T a r = 0.35–0.50 m"}
  current_uA:       {v: 150.0,  src: DS,   note: "versiones 100/150/180/300 µA en blanco; 2 haces simultáneos"}
  dE_turn_keV:      {v: auto,   src: CALC, note: "2·N_dee·V·sin(h·α_dee/2) ≈ 98 keV/vuelta"}
  hill_eff_angle:   {v: auto,   src: CALC, note: "ancho efectivo hard-edge resuelto por isocronía exacta (≈46.7°)"}

yoke:                              # A = tapa, B = yugo lateral
  side:             {v: 1740.0, src: TUP04}
  height:           {v: 860.0,  src: TUP04}
  corner_chamfer:   {v: 263.0,  src: T04F2, note: "cateto del chaflán; las 4 esquinas cortadas"}
  plate_thickness:  {v: 181.0,  src: CALC, note: "v0.18: FE calibrado (validation/calibrar_iman.py). T04F1 da 166 ± 15 (razón A:B = 86:137 px); 181 es el extremo superior y quita 2.6 kA·v de caída radial en la tapa (Bmax 2.23 → 2.18 T). Antes 166 (T04F1)"}
  cavity_radius:    {v: 778.0,  src: T04F2, note: "radio interior del yugo lateral B"}
  port_height:      {v: 120.0,  src: EST,  note: "muescas en la cara superior de B (T04F1, foto S09)"}
  port_widths:      {v: [143.0, 250.0], src: T04F2, note: "ancho a r=820 mm de los 2 puertos por cara"}
  pump_hole_radius: {v: 127.0,  src: T04F2, note: "PAT16: 2Ra = 240–300 mm para 18 MeV; 2Ra/La ≥ 70 % (reiv. 16: el modelo 67.7 %, dentro del ±3 mm de T04F2 si La ≈ 363)"}
  pump_hole_r_pos:  {v: 375.0,  src: T04F2, note: "4 agujeros en valles, atraviesan A y C"}
  is_port_w:        {v: 65.0,   src: T04F2, note: "aberturas (2) de T04F2 = inserción radial de las fuentes [VE24 Fig.1]"}
  is_port_h:        {v: 80.0,   src: EST,  note: "centrada en el plano medio, entre las bobinas"}
  lifting_corners:  {v: [45.0, 225.0], src: T04F2}
  floor_to_top:     {v: 1550.0, src: SRG,  note: "plano medio a 1120 mm del piso terminado (SRG §4.3.5 y SRG-0420; confirmado en público por JUAS22: 1.12 m) + H/2 = 430. Antes 1600 (TUD03, aprox.)"}
  edge_chamfer:     {v: 45.0,   src: DSR,  note: "chaflán 45° de las aristas exteriores superior/inferior (banda gris en la ficha)"}

pole:
  n_sectors:        {v: 4,      src: TUP04}
  hill_angle:       {v: 45.0,   src: TUP04, note: "azimutal geométrico (18/9: 55°)"}
  hill_center0:     {v: 45.0,   src: T04F2, note: "colinas hacia las esquinas, valles al centro de caras"}
  hill_side_offset: {v: 10.0,   src: T04F2, note: "lados rectos desplazados hacia dentro (colina más estrecha cerca del centro)"}
  # v0.34: ajuste de isocronía (shimming de los bordes de colina, fem/shim_iso2.py, validation/isocronia.json): giro Δα(r)
  # por lado [°] sobre los lados rectos, interpolado entre shim_r [mm]. Sin él (v0.32) el error era −3.7 % a 1 MeV y no
  # había órbita de 18 MeV. Con él: ±0.28 % en 0.5–17.5 MeV con el nivel de operación (coil.escala_iso), ventana 3D de ≈40°
  shim_r:           {v: [60, 100, 150, 200, 280, 360, 400, 430, 455, 480, 500], src: CALC}
  shim_dalpha:      {v: [0.0, 2.07, 0.69, 0.16, -0.2, 0.53, 0.07, 0.79, 0.03, 3.6, -1.61], src: CALC, note: "iteración 8 (jacobiano medido sobre las órbitas, con cotas): ensanche cerca del centro (+2.1° a 100 mm) y en el borde (+3.6° a 480 mm, el máximo que deja ≥ 5 mm al dee: la iteración 7 pedía +5.8° y se metía en la caja del dee)"}
  gap:              {v: 24.0,   src: TUP04}
  valley_floor_z:   {v: 100.0,  src: CALC, note: "v0.21: gap de valle Gv = 200 mm, límite inferior de PAT16 (US9907153 reiv. 19: 200–250). Con la cuña del corrector de gradiente (PAT16) y 115 kA·v (19 kW) el FE da ⟨B⟩ = 1.325 T y flutter 0.390 frente a KEY22 (1.3253 / 0.394). Con 110 el flutter cuadra igual pero pide 121 kA·v. Historia: 66 → 110 (v0.7) → 95 (v0.18, Gv 190, fuera de la patente) → 100"}
  sector_C_radius:  {v: 546.0,  src: T04F2, note: "disco C en 4 piezas de 90°, dentro de la cámara"}
  step1_radius:     {v: 529.0,  src: T04F2, note: "escalón 1, sigue la geometría del sector"}
  step2_edge_L:     {v: 526.0,  src: CALC,  note: "v0.34: 512 (T04F2) + 14 mm del ajuste de isocronía (tope: el escalón 1 está a 529): con 512 el campo caía ~25 mm antes que en KEY22 y no había órbita cerrada a 18 MeV. Escalón 2 (achaflanado) en el centro de colina; arco descentrado, R por óptica"}
  step2_thickness:  {v: 20.0,   src: T04F3, note: "estimado de la figura"}
  step2_chamfer:    {v: 8.0,    src: EST}
  insert_groove_w:  {v: 52.0,   src: T04F2}
  insert_groove_d:  {v: 35.0,   src: T04F3, note: "~0.65 del espesor del polo"}
  insert_recess:    {v: 2.0,    src: TUP04, note: "perfil de fresado; cortes de 10 mm × 5 mm"}
  gc_cut_width:     {v: 78.0,   src: PAT16, note: "v0.21: abertura L10 de la cuña del corrector de gradiente = 3.25·Gh (US10278277: 3–3.5·Gh). T04F3 medía 48 de ancho de la ranura vista en planta (antes)"}
  gc_cut_depth:     {v: 39.0,   src: PAT16, note: "v0.21: profundidad H10 = L10/2 (cuña de 90°) = 7.6 % de Lh (US10278277: 6–10 %). Antes 26 (EST, ranura rectangular)"}
  gc_forma:         {v: cuna,   src: PAT16, note: "corrector rebajado en cuña de 90° en el borde de la colina, en el cruce de cada trayectoria de extracción (2 por colina), en la mitad superior de la altura de la colina (lado del gap). «ranura» = forma rectangular anterior"}
  gc_alto_frac:     {v: 0.5,    src: PAT16, note: "fracción de la altura de la colina ocupada por la cuña desde el gap (US10278277: 45–55 %)"}
  central_plug_r:   {v: 52.0,   src: T04F2}
  plug_recess:      {v: 15.0,   src: CALC, note: "v0.21: rebaje del tapón F para la joroba central de KEY22 (⟨B⟩(0)/⟨B⟩(0.45 m) = 1.033) con valle 100 y cuña; 16 daba 1.011. Antes 16 (v0.18), 17 (v0.7)"}

coil:
  inner_radius:     {v: 568.0,  src: T04F2}
  radial_width:     {v: 191.0,  src: T04F2, note: "18/9: 164 mm [BON21]"}
  height:           {v: 190.0,  src: EST,  note: "apoyada sobre A (z 74→264); 18/9: 220 mm"}
  z_bottom:         {v: 59.0,   src: CALC, note: "= cara de A − altura (430 − 181 − 190)"}
  eff_density:      {v: 7.02,   src: CALC, note: "Cu 2 t en total [IPAC26] → fracción volumétrica de Cu 0.74 + epoxi-vidrio 0.16 + agua 0.10"}
  NI_FE_curva1010:  {v: 170000, src: CALC, note: "histórico (v0.7): NI que pedía el FE con la curva 1010 genérica (J_s 2.0 T), tapa 166 y valle 110. El 75 % de la fuerza magnetomotriz se iba en el hierro (Ampère por tramos, v0.18)"}
  NI_FE_calibrado:  {v: 115000, src: CALC, note: "v0.21: NI del FE 3D calibrado (acero bajo C J_s 2.12 T, tapa 181, valle 100 = Gv 200 de PAT16, corrector de gradiente en cuña de PAT16, tapón −15) para ⟨B⟩ = 1.3253 T en 0.38–0.47 m (KEY22): coincide con NI_total de 19 kW (IPAC26). v0.18: 116 k con valle 95 (fuera de la patente)"}
  escala_iso:       {v: 1.0103, src: CALC, note: "v0.35: óptimo de la simulación fuente → blanco (fem/fuente_a_blanco.py): con la región central real el haz sale a fase +13…+33° y el máximo de partículas en la lámina (55 % de la salida de la región central) está en ×1.0103 (×1.0099: 9 %, ×1.0107: 1 %); NI ≈ 119.9 kA·v. v0.34: nivel de campo de operación para isocronía (f_RF 40.640 MHz, h = 2) = mapa FE oficial a 115 kA·v × 1.0098 (óptimo 3D: 36/70 con betatrón, 34/70 con 1.0097 y 1.0099; en el mapa de la iteración 8 el óptimo era 1.0092, la diferencia es ruido de malla FE de −0.05 %); con d lnB/d lnNI = 0.24 (calibración) → NI ≈ 119.7 kA·v (+4.1 %, ≈20.6 kW). La ventana de fases útil se desplaza ±25° por cada ±0.05 % de nivel: se ajusta en operación con la corriente"}
  NI_total:         {v: 115000, src: CALC, note: "v0.21 (decisión del usuario: referencia 19 kW de IPAC26 como potencia de bobinas): P = ρ·L²·NI²/V_Cu con 2 t de Cu (IPAC26), vuelta media 4.17 m, ρ(40 °C) = 1.85e-8 Ω·m → 115 kA·v (119 a 20 °C). Antes 105 (16 kW supuestos). TUD03T «< 11 kW» (≈ 90 kA·v) queda como discrepancia registrada"}
  power_kW:         {v: 19.0,   src: IPAC26, note: "bobinas + bomba de agua e intercambiador. v0.21: se adopta 19 kW = bobinas (decisión del usuario). DISCREPANCIA registrada: TUD03T diap. 4 (IBA 2016): «keeping <11 kW magnet need» → con 2 t de Cu, NI ≤ 87–91 kA·v; el FE calibrado (116 kA·v) pide 19.4 kW de bobinas, coherente con IPAC26 solo si los 19 kW son todo bobina"}

vacuum_chamber:
  inner_radius:     {v: 548.0,  src: T04F2}
  wall:             {v: 18.0,   src: T04F2, note: "anillo entre polo y bobina [TUP04]"}

dee:
  n:                {v: 2,      src: CALC}
  valleys:          {v: [90.0, 270.0], src: TUD03, note: "Fig.2: dees en 2 valles opuestos"}
  angle:            {v: 39.0,   src: TUD03T, note: "v0.26: ancho angular de la caja del dee medido en el render en planta de TUD03T (diap. 9), rectificado con los 4 insertos de polo (a 90° y de igual longitud): 38.5–40° entre 0.4 y 1.0 R_inserto, 39.1 ± 0.6° promediando los 2 dees (en profundidades opuestas, la perspectiva se compensa). Antes 38 (EST). Cerca del centro las puntas son de 50° (punta_ang)"}
  r_min:            {v: 60.0,   src: EST,  note: "TUD03T diap. 5 (mapa Opera de la región central, mm): las puntas de los dees llegan a r ≈ 10 mm y se unen en el centro por un cuello de ≈ 3–4 mm; 60 + puente_w es una representación gruesa de eso (pendiente de refinar)"}
  r_max:            {v: 500.0,  src: EST}
  aperture:         {v: 28.0,   src: EST}
  plate_t:          {v: 8.0,    src: EST}
  stem_radius:      {v: 25.0,   src: CALC, note: "fem_rf: con la caja del dee (top_z) y los dummy dees reproduce f_RF = 40.646 MHz (T04F8; FEM 40.680, +0.08 %). Con 45 (EST anterior) no se llega ni con el dee a 10 mm del suelo del valle. Calibración no única: out/fem_rf/barrido.json"}
  top_z:            {v: 74.5,   src: CALC, note: "v0.34: las colinas ensanchadas por el shim de isocronía (Δα hasta 3.6° por lado a 480 mm) añaden capacidad dee–tierra y bajan f a 40.10 MHz con 76.7; con 74.5 → 40.638 MHz (−0.02 %, dentro del rango del sintonizador ±0.09 MHz), sensibilidad −0.245 MHz/mm. v0.26: cara superior de la caja del dee (cobre homogeneizado copper_dee_caja), 23.3 mm bajo el suelo del valle (100); 1.7 MV/m a 40 kV. Recalibrado con fem_rf (malla 0.035/0.55) con el dee de 39° (TUD03T), puntas a z 8–12, cuello y sintonizador nominal: 40.656 MHz (+0.02 %). v0.24: 78.7 con dee de 38°; v0.22: 77.9; v0.21: 75.6; v0.19: 72.6; v0.16: 86. Calibración no única"}
  puente_w:         {v: 3.5,    src: TUD03T, note: "v0.22: cuello que une las puntas de los 2 dees en el centro, medido en el mapa Opera de IBA (TUD03T diap. 5): 3.5 mm de ancho (y = −0.5…+3). Confirma el acoplamiento galvánico supuesto en v0.19 (un solo amplificador y un solo cable de 50 Ω, SRG §3.6). v0.19: placa de 36 mm (EST)"}
  puente_off:       {v: 1.25,   src: TUD03T, note: "desplazamiento del cuello respecto del eje de los dees (centro de y = −0.5…+3 mm)"}
  punta_r:          {v: 8.0,    src: TUD03T, note: "las puntas de los dees llegan a r ≈ 7–9 mm del centro (mapa Opera, diap. 5)"}
  punta_ang:        {v: 50.0,   src: TUD03T, note: "bordes radiales de las puntas a ±25° (±24.4…25.9° medidos a r ≈ 52 mm); la caja del dee (r > r_min) sigue con dee.angle"}
  punta_t:          {v: 4.0,    src: EST,  note: "espesor de las placas de la punta (z 8–12): 15 mm hasta el tapón rebajado (z 27)"}
  punta_z0:         {v: 8.0,    src: CALC, note: "v0.24: semiabertura de las puntas en la región central (placas a z 8–12, la caja del dee sigue a ±14). fem/central_region.py: con ±8 la región central acepta 95–105° de fase; con ±14 (la abertura de la caja) el campo acelerador no alcanza la chimenea, la aceptancia cae a 20–30° y el 82–90 % del haz choca en la primera vuelta"}
  dummy_gap:        {v: 6.0,    src: EST,  note: "gap acelerador dee–dummy dee (dummy dees de cobre a tierra en los bordes de las colinas: JUAS22 p.44–45, foto del C18/9); valor numérico estimado"}

rf:                               # v0.19: acoplador de potencia y sintonizador (EST: geometría no publicada)
  # KEY22: penetraciones simétricas «RF coupler» (izquierda) y «RF tuner» (derecha). Aquí: acoplador en la carcasa
  # del dee 0 (az 90°) y sintonizador en la del dee 1 (az 270°), ambos en la carcasa superior
  acoplador_tipo:   {v: lazo,   src: EST,  note: "lazo inductivo en el extremo cortocircuitado del stem (máximo de corriente), plano del lazo con el eje del stem"}
  acoplador_rho:    {v: [40.0, 110.0], src: CALC, note: "extensión radial del lazo desde el eje del stem; altura calculada (lazo_h) para acoplamiento crítico"}
  acoplador_h:      {v: 30.0,   src: CALC, note: "v0.19: altura del lazo bajo la tapa para acoplamiento crítico con 180 µA (fem/rf_acoplos.py): 21.5 kW = 18.2 kW de paredes (Q real 0.65 × cobre) + 3.24 kW de haz; fem 1.47 kV en 50 Ω; Q cargado 1680, ancho de banda 24 kHz"}
  acoplador_az:     {v: 0.0,    src: EST,  note: "orientación del lazo alrededor del stem (0 = hacia fuera, radial)"}
  coax_feed_d:      {v: [40.0, 92.0], src: EST, note: "pasamuros coaxial 50 Ω (conductor interior / exterior; 92/40 → 50 Ω en vacío)"}
  sintonizador_d:   {v: 40.0,   src: EST,  note: "pistón de cobre que baja desde la tapa de la carcasa por el hueco del stem. FEM v0.19: actúa sobre todo como sintonizador INDUCTIVO (deriva corriente del stem en la zona coaxial) → sube f; con Ø60 el efecto (+1 MHz) y las pérdidas eran excesivos"}
  sintonizador_off: {v: 75.0,   src: EST,  note: "distancia del eje del pistón al eje del stem (hacia fuera)"}
  sintonizador_gap: {v: 345.0,  src: CALC, note: "hueco punta–caja del dee en la posición nominal: punta a la salida de la carcasa (z ≈ 420), mitad del rango de frecuencia del barrido (retirado … punta a 80 mm). Rango por pistón ≈ ±0.09 MHz (fem/README_RF.md)"}
  factor_Q_real:    {v: 0.65,   src: EST,  note: "Q real / Q de cobre ideal (juntas, contactos, inox chapado); rango típico 0.5–0.8"}
  Z0_ohm:           {v: 50.0,   src: SRG,  note: "cable RF de 50 Ω entre el amplificador (PS2) y el ciclotrón (SRG §3.6)"}

ion_source:
  n:                {v: 2,      src: TUD03}
  insertion:        {v: radial, src: VE24, note: "Fig.1 (2): inserción radial por el plano medio; igual en el KEY [KEY22]; render oficial: sin caja superior"}
