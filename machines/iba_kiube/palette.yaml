version: 1
fuentes:
  v6_p1_img0.jpeg: VE24 p.1 (render oficial)
  v6_p7_img0.jpeg: VE24 p.7 (foto máquina real)
  k2_p4_img0.jpeg: KEY22 p.4 (foto interior)
metodo: "Genera palette.yaml (paleta de colores del KIUBE) muestreando las imágenes de las fichas técnicas IBA.\n\nMétodo (reproducible; regiones\
  \ en palette_src/regiones.py, figura de control en docs/paleta_regiones_*.png):\n  0. Las imágenes CMYK de los PDF se pasan a sRGB con el perfil\
  \ FOGRA39 (sin esto el cobre sale violeta).\n  1. Mediana robusta de cada región (se descarta el 25 % más claro y el 25 % más oscuro: brillos\
  \ y sombras).\n  2. Corrección de 2 puntos en luz lineal por imagen: el yugo blanco y un hueco en sombra (negro) se suponen\n     neutros. Elimina\
  \ el viraje azul del etalonaje de las fotos (no lo elimina del todo en las sombras).\n     Metales/colores saturados: se toma la mitad más cromática\
  \ de la región (sin reflejos blancos).\n  3. Color plano para imprimir/visualizar (sRGB) = muestra balanceada.\n  4. Color base PBR (lineal)\
  \ para Blender: pinturas y plásticos = muestra linealizada y escalada para que el\n     blanco del yugo tenga albedo 0.80; metales = reflectancia\
  \ F0 de tablas PBR estándar (el color de una\n     foto de metal es el reflejo del entorno, no el albedo), con el tono verificado contra la\
  \ foto.\n  5. RAL más cercano por ΔE76 en CIELAB contra una tabla RAL Classic aproximada (sRGB de referencia): ORIENTATIVO,\n     las fichas\
  \ no indican RAL."
advertencias:
- 'Las fichas técnicas no especifican colores ni códigos RAL: todo color es MEDIDO en imágenes (fotos/render con iluminación, compresión JPEG
  y retoque de marketing) o ESTIMADO.'
- 'RAL más cercano: orientativo (ΔE76 contra tabla aproximada). Para pintar una maqueta, comparar con carta física.'
- 'Render oficial y foto real difieren (chaflanes, gatos, marcos, parte superior): variante por defecto = foto real.'
